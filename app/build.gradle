plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.vibrateonly.app'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.vibrateonly.app'
        minSdk = 31
        targetSdk = 36
        // Each GitHub build gets a higher version number.
        versionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
        versionName = "1.0.${versionCode}"
    }

    signingConfigs {
        // The build server passes the same keystore every time, so new versions install as updates.
        if (project.hasProperty('signKeystore')) {
            stable {
                storeFile = file(project.property('signKeystore'))
                storePassword = 'android'
                keyAlias = 'vibrateonly'
                keyPassword = 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = project.hasProperty('signKeystore') ? signingConfigs.stable : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    // Workplace detection (geofencing).
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
