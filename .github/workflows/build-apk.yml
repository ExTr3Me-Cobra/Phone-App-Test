name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk VibrateOnly.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VibrateOnly-apk
          path: VibrateOnly.apk

      - name: Publish download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Vibrate Only (build ${{ github.run_number }})
          body: |
            On your phone, tap **VibrateOnly.apk** below to download it, then open it to install.
            See the README for the first-time setup steps.
          files: VibrateOnly.apk
          make_latest: true
