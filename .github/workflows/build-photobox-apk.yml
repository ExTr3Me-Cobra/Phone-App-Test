name: Build PhotoBox APK

on:
  push:
    paths:
      - 'gallery/**'
      - 'fossify-commons/**'
      - 'imagetoolbox/**'
      - 'photobox/**'
      - '.github/workflows/build-photobox-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so every build signs with the same saved key.
concurrency:
  group: photobox-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: imagetoolbox
    steps:
      - uses: actions/checkout@v4

      # Image Toolbox is a big build; extra swap keeps the runner from running out of memory.
      - name: Add swap space
        working-directory: .
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Every build must be signed with the same key, or Android refuses to install it as an
      # update ("App not installed"). The key is made once and kept in the build cache.
      - name: Reuse the same signing key
        uses: actions/cache@v4
        with:
          path: signing/photobox.keystore
          key: photobox-signing-key-v1

      - name: Make the signing key (first build only)
        working-directory: .
        run: |
          mkdir -p signing
          if [ ! -f signing/photobox.keystore ]; then
            keytool -genkeypair -v -keystore signing/photobox.keystore -alias photobox \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass android -keypass android -dname "CN=PhotoBox"
          fi
          keytool -list -v -keystore signing/photobox.keystore -storepass android | grep SHA256

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossRelease --stacktrace
          ls -la app/build/outputs/apk/foss/release/

      - name: Sign
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          OUT=app/build/outputs/apk/foss/release
          sign() {
            $APKSIGNER sign --ks ../signing/photobox.keystore --ks-key-alias photobox \
              --ks-pass pass:android --key-pass pass:android --out "../$2" "$1"
          }
          sign "$(ls $OUT/*universal*.apk)" PhotoBox.apk
          sign "$(ls $OUT/*arm64-v8a*.apk)" PhotoBox-arm64.apk
          ls -la ../PhotoBox*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoBox-apk
          path: PhotoBox*.apk

      - name: Publish download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: photobox-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: PhotoBox (build ${{ github.run_number }})
          body: |
            On your phone, tap **PhotoBox.apk** below to download it, then open it to install.
            **PhotoBox-arm64.apk** is a smaller download that works on almost every modern phone
            (including Samsung Galaxy); use **PhotoBox.apk** if that one won't install.

            Fossify Gallery (GPL-3.0) for browsing photos, with Image Toolbox (Apache-2.0) as the
            editor.
          files: |
            PhotoBox.apk
            PhotoBox-arm64.apk
          make_latest: false
