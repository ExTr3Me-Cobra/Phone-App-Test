name: Build Date Tile APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so every build signs with the same saved key.
concurrency:
  group: date-tile-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Every build must be signed with the same key, or Android refuses to install it as an
      # update ("App not installed"). The key is made once and kept in the build cache.
      - name: Reuse the same signing key
        uses: actions/cache@v4
        with:
          path: signing/datetile.keystore
          key: datetile-signing-key-v1

      - name: Make the signing key (first build only)
        run: |
          mkdir -p signing
          if [ ! -f signing/datetile.keystore ]; then
            keytool -genkeypair -v -keystore signing/datetile.keystore -alias datetile \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass android -keypass android -dname "CN=Date Tile"
          fi
          keytool -list -v -keystore signing/datetile.keystore -storepass android | grep SHA256

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace -PsignKeystore=$PWD/signing/datetile.keystore
          cp app/build/outputs/apk/release/app-release.apk DateTile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DateTile-apk
          path: DateTile.apk

      - name: Publish download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: date-tile-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Date Tile (build ${{ github.run_number }})
          body: |
            On your phone, tap **DateTile.apk** below to download it, then open it to install.
            See the README on the claude/date-widget-app branch for setup steps.
          files: DateTile.apk
          make_latest: false
