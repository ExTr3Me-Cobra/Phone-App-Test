name: Build Viper Vision APK

on:
  push:
    paths:
      - 'gallery/**'
      - 'fossify-commons/**'
      - 'imagetoolbox/**'
      - 'vipervision/**'
      - '.github/workflows/build-vipervision-apk.yml'
  workflow_dispatch:
    inputs:
      all_in_one:
        description: 'Also make the all-in-one APK (every AI model inside, about 1.8 GB)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# One build at a time. A newer push cancels a build that's still running, since only the newest
# version matters (the signing key already exists, so a cancelled build can't lose it).
concurrency:
  group: vipervision-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: imagetoolbox
    steps:
      - uses: actions/checkout@v4

      # Image Toolbox is a big build; extra swap keeps the runner from running out of memory.
      - name: Add swap space
        working-directory: .
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Save the build cache from this branch too (by default only the main branch saves it),
      # so later builds don't recompile everything.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Every build must be signed with the same key, or Android refuses to install it as an
      # update ("App not installed"). The key is made once and kept in the build cache.
      - name: Reuse the same signing key
        uses: actions/cache@v4
        with:
          path: signing/vipervision.keystore
          key: vipervision-signing-key-v1

      # The build cache forgets anything unused for 7 days, so the key is also kept as an
      # encrypted copy in the "vipervision-signing-key" release, locked with the passphrase saved
      # as the repository secret VIPERVISION_KEY_PASSPHRASE (only GitHub and its owner can read
      # it). Without that secret nothing is backed up yet, and builds work as before.
      - name: Make, restore or back up the signing key
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PASSPHRASE: ${{ secrets.VIPERVISION_KEY_PASSPHRASE }}
        run: |
          mkdir -p signing
          KEY=signing/vipervision.keystore
          BACKUP_TAG=vipervision-signing-key
          has_backup() { gh release view "$BACKUP_TAG" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx vipervision.keystore.enc; }
          if [ ! -f "$KEY" ] && has_backup; then
            if [ -z "$PASSPHRASE" ]; then
              echo "::error::The signing key is only in its encrypted backup, and the VIPERVISION_KEY_PASSPHRASE secret is missing. Add it (same passphrase as before) and run the build again."
              exit 1
            fi
            gh release download "$BACKUP_TAG" --repo "$REPO" --pattern vipervision.keystore.enc --dir signing
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/vipervision.keystore.enc -out "$KEY" -pass env:PASSPHRASE
            rm signing/vipervision.keystore.enc
            echo "Restored the signing key from its encrypted backup."
          fi
          if [ ! -f "$KEY" ]; then
            keytool -genkeypair -v -keystore "$KEY" -alias vipervision \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass android -keypass android -dname "CN=Viper Vision"
          fi
          keytool -list -v -keystore "$KEY" -storepass android | grep SHA256
          if [ -n "$PASSPHRASE" ] && ! has_backup; then
            gh release view "$BACKUP_TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$BACKUP_TAG" --repo "$REPO" \
              --title "Viper Vision signing key (encrypted)" --latest=false --target "${{ github.sha }}" \
              --notes "An encrypted backup of the key every Viper Vision build is signed with, so updates keep installing over each other. Useless without the owner's passphrase. Nothing to download here."
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$KEY" -out vipervision.keystore.enc -pass env:PASSPHRASE
            gh release upload "$BACKUP_TAG" vipervision.keystore.enc --repo "$REPO"
            rm vipervision.keystore.enc
            echo "Backed up the signing key (encrypted)."
          elif [ -z "$PASSPHRASE" ]; then
            echo "::notice::The signing key has no backup yet: add the repository secret VIPERVISION_KEY_PASSPHRASE to keep one."
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossRelease --stacktrace
          ls -la app/build/outputs/apk/foss/release/

      - name: Sign
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          OUT=app/build/outputs/apk/foss/release
          sign() {
            $APKSIGNER sign --ks ../signing/vipervision.keystore --ks-key-alias vipervision \
              --ks-pass pass:android --key-pass pass:android --out "../$2" "$1"
          }
          # With one ABI there's a single APK; with several, use the universal one.
          APK=$(ls $OUT/*universal*.apk 2>/dev/null || ls $OUT/*.apk | head -1)
          sign "$APK" ViperVision.apk
          ls -la ../ViperVision*.apk

      - name: Publish download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vipervision-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Viper Vision (build ${{ github.run_number }})
          body: |
            On your phone, tap **ViperVision.apk** below to download it, then open it to install.
            It downloads its AI models (about 2 GB) itself, once.

            When this build was asked for with the all-in-one, **ViperVision-AllInOne.apk** (added
            a few minutes after the build) is the same app with every AI model inside it, for a fresh install with no internet afterwards: it unpacks the
            models, then switches itself to the normal version (tap Update when Android asks).

            Fossify Gallery (GPL-3.0) for browsing photos, with Viper Vision's own photo and video
            editor (built on Image Toolbox's engines, Apache-2.0).
          files: ViperVision.apk
          make_latest: false

  # The all-in-one APK: the APK just built plus every AI model from the "vipervision-ai-models"
  # release (compressed, about 2 GB → 1.7 GB) and a copy of the normal APK, which the app installs
  # over itself once it has unpacked the models (ModelPack.switchToSlim). GitHub takes files up to
  # 2 GiB. Its own runner, since the build's runner has little disk left. Only when asked for
  # (Run workflow with "all-in-one" ticked); pushes make just the normal APK.
  all-in-one:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.all_in_one
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: vipervision-build-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the signing key
        uses: actions/cache/restore@v4
        with:
          path: signing/vipervision.keystore
          key: vipervision-signing-key-v1
          fail-on-cache-miss: true

      - name: Make the all-in-one APK
        run: |
          mkdir -p slim pack/assets/vv_models
          gh release download "$TAG" --repo "$REPO" --pattern ViperVision.apk --dir slim
          gh release download vipervision-ai-models --repo "$REPO" --dir pack/assets/vv_models
          # The names and sizes the app looks for (AndroidDownloadManager.copyBundled).
          (cd pack/assets/vv_models && for f in *; do [ "$f" = index.txt ] && continue; echo "$f $(stat -c%s "$f")"; done > index.txt)
          cat pack/assets/vv_models/index.txt
          grep -q '^siglip2__vocab.bin ' pack/assets/vv_models/index.txt || { echo "::error::The model release has no siglip2__vocab.bin yet (Mirror AI models workflow)"; exit 1; }
          cp slim/ViperVision.apk pack/assets/vv_slim.apk
          # Start from the normal APK without its signature, add the models (compressed) and the
          # normal APK (stored as is, so it can be streamed to the installer).
          cp slim/ViperVision.apk work.apk
          for pattern in 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF'; do
            zip -q -d work.apk "$pattern" || true
          done
          (cd pack && zip -q -9 -r ../work.apk assets/vv_models && zip -q -0 ../work.apk assets/vv_slim.apk)
          rm -rf pack slim
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          ${BUILD_TOOLS}zipalign -P 16 -f 4 work.apk aligned.apk || ${BUILD_TOOLS}zipalign -p -f 4 work.apk aligned.apk
          rm work.apk
          ${BUILD_TOOLS}apksigner sign --ks signing/vipervision.keystore --ks-key-alias vipervision \
            --ks-pass pass:android --key-pass pass:android --out ViperVision-AllInOne.apk aligned.apk
          rm aligned.apk
          ${BUILD_TOOLS}apksigner verify ViperVision-AllInOne.apk
          size=$(stat -c%s ViperVision-AllInOne.apk)
          echo "All-in-one APK: $size bytes"
          [ "$size" -lt 2147483648 ] || { echo "::error::The all-in-one APK is over GitHub's 2 GiB limit"; exit 1; }

      - name: Add it to the release
        run: gh release upload "$TAG" ViperVision-AllInOne.apk --repo "$REPO" --clobber

  # Keeps GitHub tidy after a good build: only the newest few Viper Vision releases, build logs
  # and this branch's build caches. Other apps' releases, workflows and caches are left alone,
  # and no signing key is ever deleted.
  cleanup:
    needs: [build, all-in-one]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      KEEP: 3
    steps:
      - name: Delete old Viper Vision releases and their tags
        run: |
          # The newest release with an all-in-one APK is kept too, however old.
          keep_aio=$(gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | select(any(.assets[]; .name == "ViperVision-AllInOne.apk")) | .tag_name' \
            | grep -E '^vipervision-build-[0-9]+$' | sort -t- -k3 -n -r | head -1 || true)
          echo "Keeping the newest all-in-one: ${keep_aio:-none}"
          gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[].tag_name' \
            | grep -E '^vipervision-build-[0-9]+$' | grep -vxF "${keep_aio:-none}" | sort -t- -k3 -n -r | tail -n +$((KEEP + 1)) \
            | while read -r tag; do
                echo "Deleting release $tag"
                gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag || true
              done

      - name: Delete old build logs
        run: |
          gh api --paginate "repos/$REPO/actions/workflows/build-vipervision-apk.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[].id' | sort -n -r | tail -n +$((KEEP + 1)) \
            | while read -r id; do
                gh api -X DELETE "repos/$REPO/actions/runs/$id" || true
              done
          # Stored files from older builds (the APK is on the Releases page instead).
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "ViperVision-apk") | .id' \
            | while read -r id; do gh api -X DELETE "repos/$REPO/actions/artifacts/$id" || true; done

      - name: Delete build caches this build didn't use
        run: |
          # The build just saved and used its caches; anything of this branch untouched for 3
          # hours is stale. Signing keys (this app's or any other's) are never deleted.
          cutoff=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$REPO/actions/caches?per_page=100&ref=${{ github.ref }}" \
            --jq ".actions_caches[] | select((.key | test(\"sign|keystore\"; \"i\") | not) and .last_accessed_at < \"$cutoff\") | .id" \
            | while read -r id; do gh api -X DELETE "repos/$REPO/actions/caches/$id" || true; done
