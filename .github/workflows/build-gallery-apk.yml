name: Build Gallery APK

on:
  push:
    paths:
      - 'gallery/**'
      - '.github/workflows/build-gallery-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so every build signs with the same saved key.
concurrency:
  group: gallery-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gallery
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Every build must be signed with the same key, or Android refuses to install it as an
      # update ("App not installed"). The key is made once and kept in the build cache.
      - name: Reuse the same signing key
        uses: actions/cache@v4
        with:
          path: gallery/signing/gallery.keystore
          key: gallery-signing-key-v1

      - name: Make the signing key (first build only)
        run: |
          mkdir -p signing
          if [ ! -f signing/gallery.keystore ]; then
            keytool -genkeypair -v -keystore signing/gallery.keystore -alias gallery \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass android -keypass android -dname "CN=Gallery"
          fi
          keytool -list -v -keystore signing/gallery.keystore -storepass android | grep SHA256

      - name: Build
        env:
          SIGNING_KEY_ALIAS: gallery
          SIGNING_KEY_PASSWORD: android
          SIGNING_STORE_FILE: ${{ github.workspace }}/gallery/signing/gallery.keystore
          SIGNING_STORE_PASSWORD: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossRelease --stacktrace
          cp app/build/outputs/apk/foss/release/*.apk ../Gallery.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gallery-apk
          path: Gallery.apk

      - name: Publish download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gallery-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Gallery (build ${{ github.run_number }})
          body: |
            On your phone, tap **Gallery.apk** below to download it, then open it to install.
            Based on Fossify Gallery (GPL-3.0).
          files: Gallery.apk
          make_latest: false
