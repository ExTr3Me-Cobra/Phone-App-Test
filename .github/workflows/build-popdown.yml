name: Build Pop Down APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Every build must be signed with the same key, or Android refuses to install it as an
      # update ("App not installed"). The key is made once and kept in the build cache.
      - name: Reuse the same signing key
        uses: actions/cache@v4
        with:
          path: signing/popdown.keystore
          key: popdown-signing-key-v2

      - name: Make the signing key (first build only)
        run: |
          mkdir -p signing
          if [ ! -f signing/popdown.keystore ]; then
            keytool -genkeypair -v -keystore signing/popdown.keystore -alias popdown \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass android -keypass android -dname "CN=Pop Down"
          fi
          keytool -list -v -keystore signing/popdown.keystore -storepass android | grep SHA256

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace -PsignKeystore=$PWD/signing/popdown.keystore
          cp app/build/outputs/apk/release/app-release.apk PopDown.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PopDown-apk
          path: PopDown.apk

      - name: Publish download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: popdown-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Pop Down (build ${{ github.run_number }})
          body: |
            On your phone, tap **PopDown.apk** below to download it, then open it to install.
            See the README on the claude/popdown-app branch for setup steps.
          files: PopDown.apk
          make_latest: false
