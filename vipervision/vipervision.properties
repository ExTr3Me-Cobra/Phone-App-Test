# The combined app's identity. Change these to rename the app.
# APP_ID is the Android package name: changing it after installing makes a separate app.
APP_ID=com.vipervision.app
APP_NAME=Viper Vision
VERSION_NAME=1.0.0
VERSION_CODE=1
# Processor types to build for, comma separated. arm64-v8a covers practically every phone from
# the last ~8 years (all current Samsung Galaxy phones). Add armeabi-v7a for very old phones or
# x86_64 for emulators; with more than one, a combined "universal" APK is built too.
ABIS=arm64-v8a
# Extra maximum-strength recompression of release APKs: ~10 minutes per APK to make the download
# about 4% smaller. Off by default.
OPTIMIZE_APK=false
